<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – EricKun-Ya</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header id="nav"></header>
  <main class="page">
    <h1>Dashboard</h1>
    <div id="message" class="message" style="display:none"></div>

    <section class="tiles" id="pl-tiles"></section>

    <section class="card">
      <h2>Steuer-Rücklage</h2>
      <label class="inline">Rücklagensatz (%)
        <input type="number" step="0.01" id="reserve-rate" />
        <button id="save-reserve">Speichern</button>
      </label>
      <p class="hint">Schätzung zur Orientierung – keine Buchhaltung (GoBD).</p>
    </section>

    <section class="card">
      <h2>Monatsumsatz <span id="year-label"></span></h2>
      <div id="monthly-chart" class="bar-chart"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Ziele</h2>
        <button id="new-goal-btn" class="secondary">+ Ziel</button>
      </div>
      <form id="goal-form" class="form-grid" style="display:none">
        <label>Titel<input type="text" id="g-title" required /></label>
        <label>Zielbetrag (€)<input type="number" step="0.01" id="g-target" required /></label>
        <label>Metrik
          <select id="g-metric">
            <option value="revenue">Umsatz</option>
            <option value="profit">Gewinn</option>
          </select>
        </label>
        <label>Periode
          <select id="g-period">
            <option value="monthly">Monatlich</option>
            <option value="yearly" selected>Jährlich</option>
            <option value="total">Gesamt</option>
          </select>
        </label>
        <label>Start<input type="date" id="g-start" required /></label>
        <label>Ende (optional)<input type="date" id="g-end" /></label>
        <div class="form-actions full">
          <button type="submit">Speichern</button>
          <button type="button" id="cancel-goal" class="secondary">Abbrechen</button>
        </div>
      </form>
      <div id="goals"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/finance.js"></script>
</body>

</html>
