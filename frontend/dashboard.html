<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – EricKun-Ya</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="nav"></header>
  <main class="page">
    <div class="page-head">
      <h1>Dashboard</h1>
      <div class="period-switch" id="period-switch">
        <button data-period="today">Heute</button>
        <button data-period="month">Monat</button>
        <button data-period="year" class="active">Jahr</button>
        <button data-period="all">Gesamt</button>
      </div>
    </div>
    <div id="message" class="message" style="display:none"></div>

    <section class="tiles" id="pl-tiles"></section>

    <section class="card">
      <div class="card-head">
        <h2>Ziele</h2>
        <a href="finances.html" class="link-btn">Verwalten →</a>
      </div>
      <div id="goals"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ebay-orders.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
