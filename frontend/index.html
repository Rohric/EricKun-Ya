<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – eBay-Tool</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>eBay-Verkaufstool</h1>
    <div id="message" class="message" style="display:none"></div>

    <form id="login-form">
      <h2>Anmelden</h2>
      <label>E-Mail<input type="email" id="login-email" autocomplete="username" required /></label>
      <label>Passwort<input type="password" id="login-password" autocomplete="current-password" required /></label>
      <button type="submit">Anmelden</button>
    </form>

    <form id="register-form" style="display:none">
      <h2>Registrieren</h2>
      <label>Name<input type="text" id="reg-name" required /></label>
      <label>E-Mail<input type="email" id="reg-email" required /></label>
      <label>Passwort<input type="password" id="reg-password" required /></label>
      <label>Passwort wiederholen<input type="password" id="reg-password2" required /></label>
      <button type="submit">Konto erstellen</button>
    </form>

    <p class="toggle"><a href="#" id="toggle-auth">Noch kein Konto? Registrieren</a></p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
