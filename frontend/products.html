<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artikel – eBay-Tool</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="nav"></header>
  <main class="page">
    <div class="page-head">
      <h1>Artikel</h1>
      <button id="new-product-btn">+ Neuer Artikel</button>
    </div>
    <div id="message" class="message" style="display:none"></div>

    <form id="product-form" class="card form-grid" style="display:none">
      <input type="hidden" id="product-id" />
      <label>Titel<input type="text" id="p-title" required /></label>
      <label>Zustand
        <select id="p-condition">
          <option value="new">Neu</option>
          <option value="like_new">Wie neu</option>
          <option value="very_good">Sehr gut</option>
          <option value="good" selected>Gut</option>
          <option value="acceptable">Akzeptabel</option>
          <option value="for_parts">Defekt / Ersatzteile</option>
        </select>
      </label>
      <label>Einkaufspreis (€)<input type="number" step="0.01" id="p-purchase" required /></label>
      <label>Verkaufspreis (€)<input type="number" step="0.01" id="p-sale" required /></label>
      <label>Menge<input type="number" id="p-quantity" value="1" min="0" /></label>
      <label>Einkaufsdatum<input type="date" id="p-date" /></label>
      <label class="full">Beschreibung<textarea id="p-description" rows="3"></textarea></label>
      <div class="form-actions full">
        <button type="submit">Speichern</button>
        <button type="button" id="cancel-product" class="secondary">Abbrechen</button>
      </div>
    </form>

    <table class="data-table">
      <thead>
        <tr><th>SKU</th><th>Titel</th><th>Zustand</th><th>EK</th><th>VK</th><th>Gewinn</th><th>Menge</th><th></th></tr>
      </thead>
      <tbody id="product-rows"></tbody>
    </table>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
